<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>iPad mini - Advanced Glass Cockpit Controller v5</title>
<style>
*, *::before, *::after {
box-sizing: border-box;
}
body {
margin: 0;
padding: 0;
background-color: #06080c;
color: #ffffff;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
overflow: hidden;
width: 100vw;
height: 100vh;
user-select: none;
-webkit-user-select: none;
display: flex;
flex-direction: row;
}

/* [구조 교정] 왼쪽 고정: 쓰로틀 표시계 컨테이너 */
#throttle-container {
width: 100px !important;
min-width: 100px !important;
max-width: 100px !important;
flex-shrink: 0 !important;
overflow: hidden !important;
box-sizing: border-box;
height: 100vh;
background: #0d1117;
border-right: 2px solid #202a3a;
padding: 20px 5px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
}
.throttle-title {
font-size: 11px;
font-weight: 700;
color: #8b949e;
letter-spacing: 1px;
}
.throttle-track {
flex: 1;
width: 24px;
background: #161b22;
border: 2px solid #30363d;
border-radius: 12px;
margin: 20px 0;
position: relative;
display: flex;
flex-direction: column-reverse;
overflow: hidden;
}
.throttle-fill {
width: 100%;
height: 0%;
background: linear-gradient(180deg, #ff9b26 0%, #238636 80%);
box-shadow: 0 0 10px rgba(35, 134, 54, 0.5);
transition: height 0.1s linear;
}
.throttle-value {
font-size: 18px;
font-family: 'Courier New', Courier, monospace;
font-weight: 700;
color: #58a6ff;
text-shadow: 0 0 5px rgba(88, 166, 255, 0.3);
}

/* 오른쪽 메인 컨트롤 영역 */
#main-container {
flex: 1;
height: 100vh;
display: flex;
flex-direction: column;
padding: 15px;
gap: 15px;
}

/* 상단 네비게이션 인디케이터 바 */
#nav-status-bar {
height: 60px;
background: #161b22;
border: 2px solid #30363d;
border-radius: 10px;
display: flex;
flex-direction: row;
align-items: center;
padding: 0 20px;
justify-content: space-between;
}
.nav-zone {
display: flex;
align-items: center;
gap: 10px;
opacity: 0.4;
transition: opacity 0.3s ease;
}
.nav-active {
opacity: 1.0 !important;
}
.nav-label {
font-size: 12px;
color: #8b949e;
font-weight: 600;
}
.nav-value {
font-size: 18px;
font-weight: 700;
color: #ffffff;
font-family: 'Courier New', Courier, monospace;
}
.nav-arrow {
color: #30363d;
font-weight: 700;
}
.nav-active .nav-arrow {
color: #58a6ff !important;
}
.nav-active .status-loc { color: #2ea44f; }
.nav-active .status-gs { color: #ff9b26; }

/* 중앙 계기 및 조작부 하이브리드 그리드 */
#center-grid {
flex: 1;
display: grid;
grid-template-columns: 1.2s 2fr;
gap: 15px;
}

/* 대형 계기판 박스 */
.glass-display {
background: #0d1117;
border: 2px solid #30363d;
border-radius: 12px;
padding: 15px;
display: flex;
flex-direction: column;
justify-content: space-around;
}
.instrument-block {
display: flex;
justify-content: space-between;
align-items: center;
border-bottom: 1px solid #21262d;
padding-bottom: 8px;
}
.instrument-block:last-child {
border-bottom: none;
padding-bottom: 0;
}
.ins-label {
font-size: 13px;
color: #8b949e;
font-weight: 600;
}
.ins-value {
font-size: 32px;
font-weight: 700;
font-family: 'Courier New', Courier, monospace;
color: #ffffff;
}
.color-hdg { color: #58a6ff; }
.color-ias { color: #79c0ff; }
.color-alt { color: #56d364; }

/* 하드웨어 물리 느낌 버튼 패널 */
.hardware-panel {
background: #161b22;
border: 2px solid #21262d;
border-radius: 12px;
padding: 15px;
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 12px;
}
.hw-btn {
background: linear-gradient(180deg, #21262d 0%, #161b22 100%);
border: 2px solid #30363d;
border-radius: 8px;
color: #c9d1d9;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 12px 0;
font-weight: 700;
font-size: 14px;
position: relative;
box-shadow: 0 4px 6px rgba(0,0,0,0.3);
cursor: pointer;
transition: all 0.1s ease;
}
.hw-btn:active {
background: #0d1117;
border-color: #58a6ff;
transform: scale(0.97);
}
.btn-desc {
font-size: 9px;
color: #8b949e;
margin-top: 4px;
font-weight: 500;
}

/* 인디케이터 LED 램프 스타일 */
.led-indicator {
width: 14px;
height: 6px;
background-color: #21262d;
border-radius: 3px;
position: absolute;
top: 6px;
box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
transition: all 0.1s ease;
}
.led-active-green {
background-color: #2ea44f !important;
box-shadow: 0 0 8px #2ea44f, inset 0 1px 1px rgba(255,255,255,0.5) !important;
}
.led-active-amber {
background-color: #ff9b26 !important;
box-shadow: 0 0 8px #ff9b26, inset 0 1px 1px rgba(255,255,255,0.5) !important;
}

/* 연결 상태 인디케이터 */
#connection-status {
position: fixed;
top: 10px;
right: 10px;
display: flex;
align-items: center;
gap: 8px;
padding: 8px 12px;
background: #161b22;
border: 2px solid #30363d;
border-radius: 6px;
font-size: 12px;
font-weight: 600;
}
.status-dot {
width: 8px;
height: 8px;
border-radius: 50%;
display: inline-block;
}
.status-connected {
background-color: #2ea44f;
box-shadow: 0 0 8px #2ea44f;
}
.status-disconnected {
background-color: #da3633;
box-shadow: 0 0 8px #da3633;
}
</style>
</head>
<body>

<div id="connection-status">
<span class="status-dot status-disconnected"></span>
<span id="status-text">연결 중...</span>
</div>

<div id="throttle-container">
<div class="throttle-title">THROTTLE</div>
<div class="throttle-track">
<div id="throttle-bar" class="throttle-fill"></div>
</div>
<div id="throttle-txt" class="throttle-value">0%</div>
</div>

<div id="main-container">

<div id="nav-status-bar">
<div id="nav-zone-active" class="nav-zone">
<span class="nav-label">NAV MODE:</span>
<span id="wp-0" class="nav-value">---</span>
<span class="nav-arrow">➔</span>
<span id="wp-1" class="nav-value">---</span>
<span class="nav-arrow">➔</span>
<span id="wp-2" class="nav-value">---</span>
<span class="nav-arrow">➔</span>
<span id="wp-3" class="nav-value">---</span>
</div>
<div class="nav-zone nav-active" style="gap:20px;">
<div><span class="nav-label">LOC:</span> <span id="status-loc" class="nav-value status-loc">ARMED</span></div>
<div><span class="nav-label">G/S:</span> <span id="status-gs" class="nav-value status-gs">ARMED</span></div>
</div>
</div>

<div id="center-grid">

<div class="glass-display">
<div class="instrument-block">
<span class="ins-label">HDG BUG</span>
<span id="val-hdg" class="ins-value color-hdg">000°</span>
</div>
<div class="instrument-block">
<span class="ins-label">INDICATED AIRSPEED</span>
<span id="val-ias" class="ins-value color-ias">0 KT</span>
</div>
<div class="instrument-block">
<span class="ins-label">CURRENT ALTITUDE</span>
<span id="val-alt" class="ins-value color-alt">0 FT</span>
</div>
<div class="instrument-block">
<span class="ins-label">SEL ALTITUDE</span>
<span id="val-target-alt" class="ins-value">0 FT</span>
</div>
</div>

<div class="hardware-panel">

<button class="hw-btn" onclick="sendControl('AP_TOGGLE')">
<div id="led-AP" class="led-indicator"></div>
AP
<div class="btn-desc">ENGAGE</div>
</button>
<button class="hw-btn" onclick="sendControl('ALT_TOGGLE')">
<div id="led-ALT" class="led-indicator"></div>
ALT
<div class="btn-desc">HOLD</div>
</button>
<button class="hw-btn" onclick="sendControl('VS_TOGGLE')">
<div id="led-VS" class="led-indicator"></div>
VS
<div class="btn-desc">HOLD</div>
</button>
<button class="hw-btn" onclick="sendControl('FMS_HDG')">
<div class="led-indicator"></div>
HDG SYNC
<div class="btn-desc">PUSH</div>
</button>

<button class="hw-btn" onclick="sendControl('LOC_TOGGLE')">
<div id="led-LOC" class="led-indicator"></div>
NAV / LOC
<div class="btn-desc">TRACK</div>
</button>
<button class="hw-btn" onclick="sendControl('APR_TOGGLE')">
<div id="led-APR" class="led-indicator"></div>
APR
<div class="btn-desc">ILS APPROACH</div>
</button>
<button class="hw-btn" onclick="sendControl('ALT_UP')">
▲ ALT
<div class="btn-desc">UP (+100)</div>
</button>
<button class="hw-btn" onclick="sendControl('VS_UP')">
▲ VS
<div class="btn-desc">UP (+100)</div>
</button>

<button class="hw-btn" onclick="sendControl('FMS_MENU')">
MENU
<div class="btn-desc">FMS OPTION</div>
</button>
<button class="hw-btn" onclick="sendControl('FMS_FPL')">
FPL
<div class="btn-desc">FLIGHT PLAN</div>
</button>
<button class="hw-btn" onclick="sendControl('ALT_DN')">
▼ ALT
<div class="btn-desc">DN (-100)</div>
</button>
<button class="hw-btn" onclick="sendControl('VS_DN')">
▼ VS
<div class="btn-desc">DN (-100)</div>
</button>

<button class="hw-btn" onclick="sendControl('FMS_PROC')">
PROC
<div class="btn-desc">PROCEDURE</div>
</button>
<button class="hw-btn" onclick="sendControl('FMS_CLR')">
CLR
<div class="btn-desc">CANCEL</div>
</button>
<button class="hw-btn" onclick="sendControl('FMS_ENT')">
ENT
<div class="btn-desc">EXECUTE</div>
</button>
<div style="display:flex; gap:6px;">
<button class="hw-btn" style="flex:1; padding:0;" onclick="sendControl('FMS_DIAL_LEFT')">◀</button>
<button class="hw-btn" style="flex:1; padding:0;" onclick="sendControl('FMS_DIAL_RIGHT')">▶</button>
</div>

</div>
</div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClickSound() {
try {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.04);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.04);
} catch(e){}
}

// 연결 상태 관리
function updateConnectionStatus(connected) {
const statusDot = document.querySelector('.status-dot');
const statusText = document.getElementById('status-text');
if (connected) {
statusDot.className = 'status-dot status-connected';
statusText.innerText = 'MSFS 연결됨';
} else {
statusDot.className = 'status-dot status-disconnected';
statusText.innerText = '연결 끊김';
}
}

// 로컬 웹소켓 가속 백엔드 통신 서버 인터페이스 연결
let ws;
let reconnectAttempts = 0;
const maxReconnectAttempts = 5;
const reconnectDelay = 3000;

function connectWebSocket() {
ws = new WebSocket("ws://" + window.location.hostname + ":8765");

ws.onopen = () => {
console.log("MSFS 가속 가민 시스템 동기화 완료.");
updateConnectionStatus(true);
reconnectAttempts = 0;
};

ws.onmessage = (event) => {
try {
const telemetry = JSON.parse(event.data);

// 전광 계기판 지표 실시간 출력 반영
document.getElementById('val-hdg').innerText = String(telemetry.heading).padStart(3, '0') + "°";
document.getElementById('val-ias').innerText = Math.round(telemetry.airspeed) + " KT";
document.getElementById('val-alt').innerText = Math.round(telemetry.altitude).toLocaleString() + " FT";
document.getElementById('val-target-alt').innerText = Math.round(telemetry.target_altitude).toLocaleString() + " FT";

// 쓰로틀 바 높이 조절 및 값 투영
document.getElementById('throttle-bar').style.height = telemetry.throttle + "%";
document.getElementById('throttle-txt').innerText = telemetry.throttle + "%";

// 접근 관제 유도 정보 가시화 연동
document.getElementById('status-loc').innerText = telemetry.loc_captured === 1 ? "CAPTURE" : "ARMED";
document.getElementById('status-loc').className = telemetry.loc_captured === 1 ? "nav-value status-loc nav-active" : "nav-value status-loc";
document.getElementById('status-gs').innerText = telemetry.gs_captured === 1 ? "CAPTURE" : "ARMED";
document.getElementById('status-gs').className = telemetry.gs_captured === 1 ? "nav-value status-gs nav-active" : "nav-value status-gs";

const navZone = document.getElementById('nav-zone-active');
if (telemetry.nav_mode === 1) {
navZone.classList.add('nav-active');
document.getElementById('wp-0').innerText = telemetry.wp_current;
document.getElementById('wp-1').innerText = telemetry.wp_next;
document.getElementById('wp-2').innerText = telemetry.wp_next2;
document.getElementById('wp-3').innerText = telemetry.wp_dest;
} else {
navZone.classList.remove('nav-active');
document.getElementById('wp-0').innerText = "---";
document.getElementById('wp-1').innerText = "---";
document.getElementById('wp-2').innerText = "---";
document.getElementById('wp-3').innerText = "---";
}

// [LED 싱크 제어 정정] 확실하게 전달받은 정수값 대조 유도
updateLED('led-AP', telemetry.ap_state === 1, 'led-active-green');
if (telemetry.apr_state !== undefined) updateLED('led-APR', telemetry.apr_state === 1, 'led-active-green');
if (telemetry.loc_state !== undefined) updateLED('led-LOC', telemetry.loc_state === 1, 'led-active-green');
if (telemetry.alt_state !== undefined) updateLED('led-ALT', telemetry.alt_state === 1, 'led-active-amber');
if (telemetry.vs_state !== undefined) updateLED('led-VS', telemetry.vs_state === 1, 'led-active-amber');

} catch (err) {
console.error('텔레메트리 파싱 오류:', err);
}
};

ws.onerror = (error) => {
console.error('WebSocket 오류:', error);
updateConnectionStatus(false);
};

ws.onclose = () => {
console.log("WebSocket 연결 종료");
updateConnectionStatus(false);
attemptReconnect();
};
}

function attemptReconnect() {
if (reconnectAttempts < maxReconnectAttempts) {
reconnectAttempts++;
console.log(`재연결 시도 ${reconnectAttempts}/${maxReconnectAttempts}...`);
setTimeout(connectWebSocket, reconnectDelay);
} else {
console.error('최대 재연결 시도 횟수 초과');
}
}

function updateLED(elementId, isActive, activeClass) {
const el = document.getElementById(elementId);
if (!el) return;
el.className = isActive ? `led-indicator ${activeClass}` : "led-indicator";
}

function sendControl(actionName) {
playClickSound();
if (ws && ws.readyState === WebSocket.OPEN) {
ws.send(JSON.stringify({ "action": actionName }));
} else {
console.warn('WebSocket이 연결되지 않음');
}
}

// 초기 연결 시도
connectWebSocket();
</script>
</body>
</html>
